# Default config + recipes. Copy this to your config dir
# ($XDG_CONFIG_HOME/jlf/config.toml) or workspace (.jlf.toml / jlf.toml).
# See docs/RECIPES.md for the full recipe model.

[config]
format   = "${@output}"   # the default format renders the `output` recipe
compact  = false
no_color = false
strict   = false

# `output` is the entry point: it joins the field recipes below. Field recipes
# are optional by default, so an absent field collapses its space — you write
# ${@name}, not ${?@name}. output.compact only changes the separator before JSON.
[recipe.output]
body = "${@timestamp} ${@level} ${@message}\n${@data}"

[recipe.output.compact]
body = "${@timestamp} ${@level} ${@message} ${@data}"

# Field recipes - reusable as ${@name} in a template (optional by default), or
# overridable to restyle (e.g. -v level=...).
[recipe.timestamp]
field = "timestamp"
style = "dimmed"

# `level` colors the value by its severity via $match: the subject
# (lvl|level|severity) is bound to $value, and the first matching arm renders.
# A missing level matches no arm (not even $else), so it collapses to nothing.
[recipe.level]
body = '''$match(lvl|level|severity
  $when("ERROR"|"error" => ${value:fg=red})
  $when("WARN"|"warn"   => ${value:fg=yellow})
  $when("INFO"|"info"   => ${value:fg=cyan})
  $when("DEBUG"|"debug" => ${value:fg=green})
  $when("TRACE"|"trace" => ${value:fg=cyan,dimmed})
  $else(${value})
)'''

[recipe.message]
field = "message|msg|body|fields.message"

[recipe.data]
field = ".."
style = "json"
